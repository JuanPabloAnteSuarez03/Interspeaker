services:
  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
      args:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
    image: minio/minio
    container_name: almacenamiento-S3-local
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio/minio-data:/data
    #command: server /data --console-address ":9001"
    networks:
      - interspeaker-network

networks:
  interspeaker-network:
    driver: bridge
